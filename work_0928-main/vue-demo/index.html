<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vue 作品列表对照</title><link rel="stylesheet" href="styles.css"><script src="vendor/vue.global.prod.js" defer></script><script src="works-data.js" defer></script><script src="vue-app.js" defer></script></head>
<body><main class="container"><h1>Vue 作品列表</h1><p>同一份数据，使用 v-for 描述界面。此页用于第 6 课对照，不替换你的主页。</p><div id="vue-works"><ol class="portfolio-list"><li v-for="work in works" :key="work.url" class="work-card"><a :href="work.url" target="_blank" rel="noopener noreferrer"><div class="work-cover"><img :src="work.image" :alt="work.title" width="1200" height="800"></div><div class="work-copy"><h3>{{ work.title }}</h3><p>{{ work.description }}</p></div></a></li></ol></div><p><a href="../index.html">回到主页</a></p></main></body></html>
